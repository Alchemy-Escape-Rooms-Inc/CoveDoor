; PlatformIO Project Configuration File
;
; Cove Sliding Door Controller + Maglock (v2.0.0)
; ESP32-S3-DevKitC-1 + BTS7960 Dual H-Bridge Motor Driver + Maglock Relay

[platformio]
default_envs = esp32-s3-devkitc-1

; Pinned to 6.9.0 — last release using Arduino core 2.x, which keeps the
; legacy ledcSetup()/ledcAttachPin() API. See QUIRK:LEDC_API_VERSION in
; MANIFEST.h. Do not bump without migrating PWM calls in main.cpp.

; Current target: ESP32-S3 combined door + maglock board
[env:esp32-s3-devkitc-1]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; MANIFEST.h uses C++17 inline constexpr — override the Arduino default gnu++11
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

monitor_speed = 115200

lib_deps =
    knolleary/PubSubClient@^2.8

upload_speed = 921600

; LEGACY: regular ESP32-DevKitC still mounted on the door until the S3 swap.
; Only flash this env to the old board — pinout notes in MANIFEST.h assume S3.
[env:esp32]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino

build_unflags = -std=gnu++11
build_flags = -std=gnu++17

monitor_speed = 115200

lib_deps =
    knolleary/PubSubClient@^2.8

upload_speed = 921600
